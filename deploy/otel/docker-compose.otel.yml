# Optional observability stack. Start it next to the gateway with
#   PRISM_NETWORK=<project>_prism-network docker compose -f deploy/otel/docker-compose.otel.yml up -d
# where <project> is the gateway's compose project (the checkout directory
# name; `docker network ls | grep prism-network` shows it). Prometheus joins
# that network to scrape the API containers, which publish no host port
# beyond loopback. Put METRICS_TOKEN's value in deploy/otel/metrics_token
# (ignored by git) before starting.
services:
  # OpenTelemetry Collector (Receives OTLP HTTP :4318 & gRPC :4317)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: prism-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC receiver
      - "127.0.0.1:4318:4318" # OTLP HTTP receiver
      - "127.0.0.1:8888:8888" # OTel Collector internal metrics
    networks:
      - otel
      - prism
    restart: unless-stopped

  # Grafana Tempo (Distributed Tracing Backend)
  tempo:
    image: grafana/tempo:2.4.0
    container_name: prism-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "127.0.0.1:3200:3200" # Tempo HTTP
    networks:
      - otel
    restart: unless-stopped

  # Prometheus (Metrics Scraper & Time-Series DB)
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prism-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prism-alerts.yml:/etc/prometheus/prism-alerts.yml:ro
      - ./metrics_token:/etc/prometheus/metrics_token:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - otel
      - prism
    restart: unless-stopped

  # Grafana Loki (Log Aggregation)
  loki:
    image: grafana/loki:2.9.4
    container_name: prism-loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - otel
    restart: unless-stopped

  # Grafana Dashboard UI. Set GRAFANA_ADMIN_PASSWORD; the landing page uses 3001.
  grafana:
    image: grafana/grafana:10.3.3
    container_name: prism-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - otel
    restart: unless-stopped

networks:
  otel:
  prism:
    external: true
    name: ${PRISM_NETWORK:?set PRISM_NETWORK to the gateway's compose network, e.g. prism_prism-network}
