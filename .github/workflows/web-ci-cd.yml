name: Web (Landing Page) CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/web-ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/web-ci-cd.yml'
  workflow_dispatch:

# Pull requests run lint, tests and builds only; image push and deploy are
# limited to pushes to main by the jobs' `if` conditions. A newer commit on the
# same PR cancels the older run; runs on main never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  lint-and-build-check:
    name: Lint & Build Astro Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        working-directory: apps/web
        run: pnpm build

  build-and-push:
    name: Build & Push Web Docker Image to GHCR
    needs: [lint-and-build-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/prism-web
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy Web to VPS via SSH
    needs: [build-and-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: vps-deployment
      cancel-in-progress: false

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            mkdir -p ${{ secrets.VPS_WORK_DIR }}
            cd ${{ secrets.VPS_WORK_DIR }}
            if [ ! -d ".git" ]; then
              echo "Cloning private repository..."
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            fi
            # Check out exactly the commit being deployed, so compose and the
            # deploy script match the image; a failed fetch fails the deploy.
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch --quiet origin
            git checkout --quiet --detach ${{ github.sha }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Deploys the image built above (tagged sha-<short sha>) to the idle
            # colour, switches nginx only once it is healthy, and keeps the old
            # colour stopped for scripts/deploy/blue-green.sh web --rollback.
            scripts/deploy/blue-green.sh web "sha-$(echo "${{ github.sha }}" | cut -c1-7)"
