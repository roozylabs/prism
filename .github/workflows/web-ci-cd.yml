name: Web (Landing Page) CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/web-ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/web-ci-cd.yml'
  workflow_dispatch:

# Pull requests run lint, tests and builds only; image push and deploy are
# limited to pushes to main by the jobs' `if` conditions. A newer commit on the
# same PR cancels the older run; runs on main never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  lint-and-build-check:
    name: Lint & Build Astro Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        working-directory: apps/web
        run: pnpm build

  build-and-push:
    name: Build & Push Web Docker Image to GHCR
    needs: [lint-and-build-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/prism-web
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy Web to VPS via SSH
    needs: [build-and-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: vps-deployment
      cancel-in-progress: false

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            mkdir -p ${{ secrets.VPS_WORK_DIR }}
            cd ${{ secrets.VPS_WORK_DIR }}
            if [ ! -d ".git" ]; then
              echo "Cloning private repository..."
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              echo "Pulling latest changes..."
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git pull origin main || git pull origin master || true
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Determine active container color for web
            if docker ps --format '{{.Names}}' | grep -q 'prism-web-green'; then
              TARGET_SVC="web"
              TARGET_CONTAINER="prism-web"
              OLD_SVC="web-green"
              OLD_CONTAINER="prism-web-green"
              TARGET_PORT="3001"
            else
              TARGET_SVC="web-green"
              TARGET_CONTAINER="prism-web-green"
              OLD_SVC="web"
              OLD_CONTAINER="prism-web"
              TARGET_PORT="3006"
            fi

            echo "=== Blue-Green Deploying Web to $TARGET_SVC ($TARGET_CONTAINER) on port $TARGET_PORT ==="
            docker compose pull $TARGET_SVC || true
            docker compose up -d --no-deps $TARGET_SVC

            echo "Waiting for $TARGET_CONTAINER health check on port $TARGET_PORT..."
            HEALTHY=false
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{json .State.Health.Status}}' $TARGET_CONTAINER 2>/dev/null || echo '"unknown"')
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$TARGET_PORT/ || echo "000")
              if [ "$STATUS" = '"healthy"' ] || echo "$HTTP_CODE" | grep -qE '^(200|301|302|307|308)$'; then
                HEALTHY=true
                echo "$TARGET_CONTAINER is healthy (HTTP $HTTP_CODE, Docker status $STATUS)!"
                break
              fi
              echo "Health status: $STATUS, HTTP code: $HTTP_CODE (attempt $i/30)..."
              sleep 3
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "Error: $TARGET_CONTAINER failed health check. Printing container logs:"
              docker logs $TARGET_CONTAINER --tail 100 || true
              echo "Rolling back..."
              docker compose stop $TARGET_SVC || true
              exit 1
            fi

            # Update Nginx upstream config and reload
            if [ -d "/etc/nginx/conf.d" ]; then
              echo "upstream prism_web_backend { server 127.0.0.1:$TARGET_PORT; }" | sudo tee /etc/nginx/conf.d/upstream_web.conf > /dev/null || true
            fi

            # Automatically ensure sites-available / sites-enabled use prism_web_backend upstream
            for site in /etc/nginx/sites-available/* /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*; do
              if [ -f "$site" ] && grep -q "prism\.roozylabs\.com" "$site" 2>/dev/null; then
                echo "Syncing upstream for $site..."
                sudo sed -i -E 's|proxy_pass http://(127\.0\.0\.1\|localhost):300[0-9];|proxy_pass http://prism_web_backend;|g' "$site" || true
              fi
            done

            # Test Nginx syntax and reload
            if docker ps --format '{{.Names}}' | grep -q 'nginx'; then
              docker exec $(docker ps --format '{{.Names}}' | grep 'nginx' | head -n 1) nginx -t && docker exec $(docker ps --format '{{.Names}}' | grep 'nginx' | head -n 1) nginx -s reload || true
            elif command -v nginx >/dev/null 2>&1; then
              sudo nginx -t && (sudo nginx -s reload || sudo systemctl reload nginx || true) || true
            fi

            echo "Stopping old container $OLD_CONTAINER..."
            docker compose stop $OLD_SVC || true
            docker image prune -f || true

