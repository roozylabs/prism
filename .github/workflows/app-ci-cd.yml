name: App (Dashboard) CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/app/**'
      - 'pnpm-lock.yaml'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/app-ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/app/**'
      - 'pnpm-lock.yaml'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/app-ci-cd.yml'
  workflow_dispatch:

# Pull requests run lint, tests and builds only; image push and deploy are
# limited to pushes to main by the jobs' `if` conditions. A newer commit on the
# same PR cancels the older run; runs on main never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  lint-and-build-check:
    name: Lint & Build Next.js App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: apps/app
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        working-directory: apps/app
        run: pnpm build

  build-and-push:
    name: Build & Push App Docker Image to GHCR
    needs: [lint-and-build-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/prism-app
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/app
          file: ./apps/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy App to VPS via SSH
    needs: [build-and-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: vps-deployment
      cancel-in-progress: false

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            mkdir -p ${{ secrets.VPS_WORK_DIR }}
            cd ${{ secrets.VPS_WORK_DIR }}
            if [ ! -d ".git" ]; then
              echo "Cloning private repository..."
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              echo "Pulling latest changes..."
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git pull origin main || git pull origin master || true
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Determine active container color for app
            if docker ps --format '{{.Names}}' | grep -q 'prism-app-green'; then
              TARGET_SVC="app"
              TARGET_CONTAINER="prism-app"
              OLD_SVC="app-green"
              OLD_CONTAINER="prism-app-green"
              TARGET_PORT="3000"
            else
              TARGET_SVC="app-green"
              TARGET_CONTAINER="prism-app-green"
              OLD_SVC="app"
              OLD_CONTAINER="prism-app"
              TARGET_PORT="3005"
            fi

            echo "=== Blue-Green Deploying App to $TARGET_SVC ($TARGET_CONTAINER) on port $TARGET_PORT ==="
            docker compose pull $TARGET_SVC || true
            docker compose up -d --no-deps $TARGET_SVC

            echo "Waiting for $TARGET_CONTAINER health check..."
            HEALTHY=false
            for i in $(seq 1 20); do
              STATUS=$(docker inspect --format='{{json .State.Health.Status}}' $TARGET_CONTAINER 2>/dev/null || echo '"unknown"')
              if [ "$STATUS" = '"healthy"' ]; then
                HEALTHY=true
                echo "$TARGET_CONTAINER is healthy!"
                break
              fi
              echo "Health status: $STATUS (attempt $i/20)..."
              sleep 3
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "Error: $TARGET_CONTAINER failed health check. Rolling back..."
              docker compose stop $TARGET_SVC || true
              exit 1
            fi

            # Update Nginx upstream config and reload
            if [ -d "/etc/nginx/conf.d" ]; then
              echo "upstream prism_app_backend { server 127.0.0.1:$TARGET_PORT; }" | sudo tee /etc/nginx/conf.d/upstream_app.conf > /dev/null || true
            fi
            if docker ps --format '{{.Names}}' | grep -q 'nginx'; then
              docker exec $(docker ps --format '{{.Names}}' | grep 'nginx' | head -n 1) nginx -s reload || true
            elif command -v nginx >/dev/null 2>&1; then
              sudo nginx -s reload || nginx -s reload || true
            fi


            echo "Stopping old container $OLD_CONTAINER..."
            docker compose stop $OLD_SVC || true
            docker image prune -f || true

