name: App (Dashboard) CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/app/**'
      - 'pnpm-lock.yaml'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/app-ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/app/**'
      - 'pnpm-lock.yaml'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/app-ci-cd.yml'
  workflow_dispatch:

# Pull requests run lint, tests and builds only; image push and deploy are
# limited to pushes to main by the jobs' `if` conditions. A newer commit on the
# same PR cancels the older run; runs on main never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  lint-and-build-check:
    name: Lint & Build Next.js App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: apps/app
        run: pnpm install --frozen-lockfile

      - name: Run unit and component tests
        working-directory: apps/app
        run: pnpm test
      # Typecheck on its own so a type error is reported as such, not as a
      # build failure.
      - name: Typecheck
        working-directory: apps/app
        run: pnpm typecheck

      - name: Build Next.js
        working-directory: apps/app
        run: pnpm build

  build-and-push:
    name: Build & Push App Docker Image to GHCR
    needs: [lint-and-build-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/prism-app
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/app
          file: ./apps/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy App to VPS via SSH
    needs: [build-and-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: vps-deployment
      cancel-in-progress: false

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            mkdir -p ${{ secrets.VPS_WORK_DIR }}
            cd ${{ secrets.VPS_WORK_DIR }}
            if [ ! -d ".git" ]; then
              echo "Cloning private repository..."
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            fi
            # Check out exactly the commit being deployed, so compose and the
            # deploy script match the image; a failed fetch fails the deploy.
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch --quiet origin
            git checkout --quiet --detach ${{ github.sha }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Deploys the image built above (tagged sha-<short sha>) to the idle
            # colour, switches nginx only once it is healthy, and keeps the old
            # colour stopped for scripts/deploy/blue-green.sh app --rollback.
            scripts/deploy/blue-green.sh app "sha-$(echo "${{ github.sha }}" | cut -c1-7)"
