name: SDK & CLI CI

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/packages-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/packages-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typescript:
    name: Build & Typecheck TypeScript SDK and CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: the CLI typechecks against the SDK's emitted types.
      - name: Build packages
        run: pnpm --recursive --filter "./packages/*" run build

      - name: Typecheck packages
        run: pnpm --recursive --filter "./packages/*" run lint

  python:
    name: Test Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python >=3.9) and current.
        python-version: [ '3.9', '3.13' ]
    defaults:
      run:
        working-directory: packages/python-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q
