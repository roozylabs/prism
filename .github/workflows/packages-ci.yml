name: SDK & CLI CI

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/packages-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/packages-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typescript:
    name: Build & Typecheck TypeScript SDK and CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: the CLI typechecks against the SDK's emitted types.
      - name: Build packages
        run: pnpm --recursive --filter "./packages/*" run build

      - name: Typecheck packages
        run: pnpm --recursive --filter "./packages/*" run lint

  python:
    name: Test Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python >=3.9) and current.
        python-version: [ '3.9', '3.13' ]
    defaults:
      run:
        working-directory: packages/python-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q
