name: API CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/api/**'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/api-ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/api/**'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/api-ci-cd.yml'
  workflow_dispatch:

# Pull requests run lint, tests and builds only; image push and deploy are
# limited to pushes to main by the jobs' `if` conditions. A newer commit on the
# same PR cancels the older run; runs on main never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/api/go.mod'
          cache-dependency-path: 'apps/api/go.sum'

      - name: Verify Go module tidiness
        working-directory: apps/api
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: apps/api
          args: ./... --timeout=5m

  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: prism_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/api/go.mod'
          cache-dependency-path: 'apps/api/go.sum'

      - name: Run Tests
        working-directory: apps/api
        env:
          APP_ENV: test
          SERVER_PORT: "8080"
          DATABASE_URL: "postgres://postgres:postgrespassword@localhost:5432/prism_test?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"
          ENCRYPTION_KEY: "test-encryption-key-32-bytes!!"
        run: |
          go test ./... -v -race -coverprofile=coverage.out

  build-and-push:
    name: Build & Push API Docker Image to GHCR
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/prism-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy API to VPS via SSH
    needs: [build-and-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: vps-deployment
      cancel-in-progress: false

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            mkdir -p ${{ secrets.VPS_WORK_DIR }}
            cd ${{ secrets.VPS_WORK_DIR }}
            if [ ! -d ".git" ]; then
              echo "Cloning private repository..."
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              echo "Pulling latest changes..."
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git pull origin main || git pull origin master || true
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Determine active container color for api
            if docker ps --format '{{.Names}}' | grep -q 'prism-api-green'; then
              TARGET_SVC="api"
              TARGET_CONTAINER="prism-api"
              OLD_SVC="api-green"
              OLD_CONTAINER="prism-api-green"
              TARGET_PORT="8080"
            else
              TARGET_SVC="api-green"
              TARGET_CONTAINER="prism-api-green"
              OLD_SVC="api"
              OLD_CONTAINER="prism-api"
              TARGET_PORT="8085"
            fi

            echo "=== Blue-Green Deploying API to $TARGET_SVC ($TARGET_CONTAINER) on port $TARGET_PORT ==="
            docker compose pull $TARGET_SVC || true

            # Run schema migration once as a one-shot job before starting the green container.
            # This prevents runtime API containers from racing DDL locks at startup.
            if [ -f "docker-compose.yml" ] && grep -q "migrator:" docker-compose.yml; then
              echo "Running one-shot database migration (migrator)..."
              docker compose run --rm migrator || exit 1
            fi

            docker compose up -d --no-deps $TARGET_SVC

            echo "Waiting for $TARGET_CONTAINER health check..."
            HEALTHY=false
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{json .State.Health.Status}}' $TARGET_CONTAINER 2>/dev/null || echo '"unknown"')
              HTTP_CODE=$(curl -s --max-time 5 -o /dev/null -w "%{http_code}" http://localhost:$TARGET_PORT/ready || echo "000")
              # /ready answers 200 only when PostgreSQL and Redis respond.
              if [ "$HTTP_CODE" = "200" ]; then
                HEALTHY=true
                echo "$TARGET_CONTAINER is healthy (HTTP $HTTP_CODE, Docker status $STATUS)!"
                break
              fi
              echo "Health status: $STATUS, HTTP code: $HTTP_CODE (attempt $i/30)..."
              sleep 3
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "Error: $TARGET_CONTAINER failed health check. Printing container logs:"
              docker logs $TARGET_CONTAINER --tail 100 || true
              echo "Rolling back..."
              docker compose stop $TARGET_SVC || true
              exit 1
            fi

            # Update Nginx upstream config and reload
            if [ -d "/etc/nginx/conf.d" ]; then
              echo "upstream prism_api_backend { server 127.0.0.1:$TARGET_PORT; }" | sudo tee /etc/nginx/conf.d/upstream_api.conf > /dev/null || true
            fi
            if docker ps --format '{{.Names}}' | grep -q 'nginx'; then
              docker exec $(docker ps --format '{{.Names}}' | grep 'nginx' | head -n 1) nginx -s reload || true
            elif command -v nginx >/dev/null 2>&1; then
              sudo nginx -s reload || nginx -s reload || true
            fi


            echo "Stopping old container $OLD_CONTAINER..."
            docker compose stop $OLD_SVC || true
            docker image prune -f || true

