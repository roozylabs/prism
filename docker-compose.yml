services:
  # Go API Gateway Backend (Blue - Default)
  api:
    image: ghcr.io/roozylabs/prism-api:${API_IMAGE_TAG:-latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: prism-api
    restart: unless-stopped
    # Longer than SHUTDOWN_TIMEOUT_SECONDS so in-flight LLM streams can drain
    # before Docker sends SIGKILL (default grace period is 10s).
    stop_grace_period: 45s
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prism}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (generate with: openssl rand -hex 32)}"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      CLOUDFLARE_SECRET_KEY: ${CLOUDFLARE_SECRET_KEY:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      TRUSTED_PLATFORM: ${TRUSTED_PLATFORM:-}
      # Days to keep rows of each growing table; empty uses the default, 0 keeps forever.
      RETENTION_REQUEST_LOGS_DAYS: ${RETENTION_REQUEST_LOGS_DAYS:-}
      RETENTION_ROUTING_DECISIONS_DAYS: ${RETENTION_ROUTING_DECISIONS_DAYS:-}
      RETENTION_REQUEST_PAYLOADS_DAYS: ${RETENTION_REQUEST_PAYLOADS_DAYS:-}
      RETENTION_TOOL_INVOCATIONS_DAYS: ${RETENTION_TOOL_INVOCATIONS_DAYS:-}
      RETENTION_MCP_INVOCATIONS_DAYS: ${RETENTION_MCP_INVOCATIONS_DAYS:-}
      RETENTION_AI_AUDIT_TRAILS_DAYS: ${RETENTION_AI_AUDIT_TRAILS_DAYS:-}
      RETENTION_AUDIT_LOGS_DAYS: ${RETENTION_AUDIT_LOGS_DAYS:-}
      RETENTION_COST_ANOMALIES_DAYS: ${RETENTION_COST_ANOMALIES_DAYS:-}
      RETENTION_BUDGET_ALERTS_DAYS: ${RETENTION_BUDGET_ALERTS_DAYS:-}
      NEXT_PUBLIC_CLOUDFLARE_SITE_KEY: ${NEXT_PUBLIC_CLOUDFLARE_SITE_KEY:-}
      CLOUDFLARE_SITE_KEY: ${NEXT_PUBLIC_CLOUDFLARE_SITE_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.prism.roozylabs.com,https://prism.roozylabs.com,https://api.prism.roozylabs.com,http://localhost:3000}
      # Member invitations: links point at the dashboard; emailed when SMTP is set.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://app.prism.roozylabs.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Schema changes are applied only by the one-shot migrator below. If the
      # API containers migrated on startup too, blue and green would race each
      # other and the migrator for the same DDL locks.
      RUN_MIGRATIONS: "false"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      prism-network:
        aliases:
          - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Go API Gateway Backend (Green)
  api-green:
    image: ghcr.io/roozylabs/prism-api:${API_IMAGE_TAG:-latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: prism-api-green
    restart: unless-stopped
    # Longer than SHUTDOWN_TIMEOUT_SECONDS so in-flight LLM streams can drain
    # before Docker sends SIGKILL (default grace period is 10s).
    stop_grace_period: 45s
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prism}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (generate with: openssl rand -hex 32)}"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      CLOUDFLARE_SECRET_KEY: ${CLOUDFLARE_SECRET_KEY:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      TRUSTED_PLATFORM: ${TRUSTED_PLATFORM:-}
      # Days to keep rows of each growing table; empty uses the default, 0 keeps forever.
      RETENTION_REQUEST_LOGS_DAYS: ${RETENTION_REQUEST_LOGS_DAYS:-}
      RETENTION_ROUTING_DECISIONS_DAYS: ${RETENTION_ROUTING_DECISIONS_DAYS:-}
      RETENTION_REQUEST_PAYLOADS_DAYS: ${RETENTION_REQUEST_PAYLOADS_DAYS:-}
      RETENTION_TOOL_INVOCATIONS_DAYS: ${RETENTION_TOOL_INVOCATIONS_DAYS:-}
      RETENTION_MCP_INVOCATIONS_DAYS: ${RETENTION_MCP_INVOCATIONS_DAYS:-}
      RETENTION_AI_AUDIT_TRAILS_DAYS: ${RETENTION_AI_AUDIT_TRAILS_DAYS:-}
      RETENTION_AUDIT_LOGS_DAYS: ${RETENTION_AUDIT_LOGS_DAYS:-}
      RETENTION_COST_ANOMALIES_DAYS: ${RETENTION_COST_ANOMALIES_DAYS:-}
      RETENTION_BUDGET_ALERTS_DAYS: ${RETENTION_BUDGET_ALERTS_DAYS:-}
      NEXT_PUBLIC_CLOUDFLARE_SITE_KEY: ${NEXT_PUBLIC_CLOUDFLARE_SITE_KEY:-}
      CLOUDFLARE_SITE_KEY: ${NEXT_PUBLIC_CLOUDFLARE_SITE_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.prism.roozylabs.com,https://prism.roozylabs.com,https://api.prism.roozylabs.com,http://localhost:3000}
      # Member invitations: links point at the dashboard; emailed when SMTP is set.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://app.prism.roozylabs.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Schema changes are applied only by the one-shot migrator below. If the
      # API containers migrated on startup too, blue and green would race each
      # other and the migrator for the same DDL locks.
      RUN_MIGRATIONS: "false"
    ports:
      - "127.0.0.1:${API_GREEN_PORT:-8085}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      prism-network:
        aliases:
          - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot database migration job (runs before blue-green cutover)
  migrator:
    image: ghcr.io/roozylabs/prism-api:${API_IMAGE_TAG:-latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["./server", "--migrate-only"]
    container_name: prism-api-migrator
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prism}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      prism-network:

  # Next.js Frontend Dashboard (Blue - Default)
  app:
    image: ghcr.io/roozylabs/prism-app:${APP_IMAGE_TAG:-latest}
    build:
      context: ./apps/app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLOUDFLARE_SITE_KEY: ${NEXT_PUBLIC_CLOUDFLARE_SITE_KEY:-}
    container_name: prism-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:8080
      NEXT_PUBLIC_CLOUDFLARE_SITE_KEY: ${NEXT_PUBLIC_CLOUDFLARE_SITE_KEY:-}
      NODE_OPTIONS: "--max-old-space-size=512"
    depends_on:
      - api
    networks:
      prism-network:
        aliases:
          - app
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login | grep -E '^(200|302|307|308)$' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Next.js Frontend Dashboard (Green)
  app-green:
    image: ghcr.io/roozylabs/prism-app:${APP_IMAGE_TAG:-latest}
    build:
      context: ./apps/app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLOUDFLARE_SITE_KEY: ${NEXT_PUBLIC_CLOUDFLARE_SITE_KEY:-}
    container_name: prism-app-green
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_GREEN_PORT:-3005}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:8080
      NEXT_PUBLIC_CLOUDFLARE_SITE_KEY: ${NEXT_PUBLIC_CLOUDFLARE_SITE_KEY:-}
      NODE_OPTIONS: "--max-old-space-size=512"
    depends_on:
      - api
    networks:
      prism-network:
        aliases:
          - app
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login | grep -E '^(200|302|307|308)$' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Astro Landing Page Website (Blue - Default)
  web:
    image: ghcr.io/roozylabs/prism-web:${WEB_IMAGE_TAG:-latest}
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: prism-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      NODE_OPTIONS: "--max-old-space-size=512"
    networks:
      prism-network:
        aliases:
          - web
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/ | grep -E '^(200|301|302|307|308)$' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Astro Landing Page Website (Green)
  web-green:
    image: ghcr.io/roozylabs/prism-web:${WEB_IMAGE_TAG:-latest}
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: prism-web-green
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_GREEN_PORT:-3006}:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      NODE_OPTIONS: "--max-old-space-size=512"
    networks:
      prism-network:
        aliases:
          - web
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/ | grep -E '^(200|301|302|307|308)$' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: prism-postgres-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prism}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prism-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: prism-redis-cache
    restart: unless-stopped
    # Caps memory so Redis cannot take the host down. Nothing is evicted:
    # queued jobs and their state must not disappear, so at the cap writes
    # fail instead (see "Redis failure behaviour" in docs/INFRASTRUCTURE.md).
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis} --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - prism-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  prism-network:
    driver: bridge